{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Attendance Records</h3>
  <div>
    <a class="btn btn-success me-2" href="{{ url_for('register') }}">Register Student</a>
    <a class="btn btn-warning" href="{{ url_for('recognize') }}">Start Recognition</a>
  </div>
</div>

<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th>SID</th>
      <th>Name</th>
      <th>Date</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody>
    {% for r in records %}
      <tr>
        <td>{{ r[0] }}</td>
        <td>{{ r[1].replace('_',' ') }}</td>
        <td>{{ r[2] }}</td>
        <td>{{ r[3] }}</td>
      </tr>
    {% else %}
      <tr><td colspan="4" class="text-center">No records yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
