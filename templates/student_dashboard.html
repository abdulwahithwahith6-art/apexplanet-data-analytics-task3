<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<h2>Welcome, {{ name }}</h2>
<a href="{{ url_for('student_logout') }}">Logout</a>
<h3>Attendance Records</h3>
<table border="1">
<tr>
    <th>Date</th>
    <th>Time</th>
</tr>
{% for row in records %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
